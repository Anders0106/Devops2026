services:
  chirp-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - chirp-data:/app/Assets
    restart: unless-stopped

volumes:
  chirp-data:
