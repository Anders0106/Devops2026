# Docker Compose for Swarm production deployment
# Deploy with: docker stack deploy -c docker-compose.swarm.yml chirp
# Requires: docker swarm init (if not already initialized)

services:
  chirp-web:
    image: ghcr.io/anders0106/devops2026:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=chirp;Username=postgres;Password=postgres
    volumes:
      - chirp-data:/app/Assets
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - shepherd.enable=true
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chirp
    volumes:
      - chirp-db:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
  shepherd:
    image: containrrr/shepherd
    environment:
      - SLEEP_TIME=5m
      - ROLLBACK_ON_FAILURE=true
      - FILTER_SERVICES=label=shepherd.enable=true
      # Uncomment for Docker Hub auth (avoids rate limits):
      # - WITH_REGISTRY_AUTH=true
      # - REGISTRY_USER=2970
      # - REGISTRY_PASSWORD=${REGISTRY_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  chirp-data:
  chirp-db:
