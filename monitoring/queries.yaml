chirp_users_total:
  query: |
    SELECT COUNT(*) AS value FROM "AspNetUsers"
  metrics:
    - value:
        usage: "GAUGE"

chirp_cheeps:
  query: |
    SELECT COUNT(*) AS value FROM "Cheeps"
  metrics:
    - value:
        usage: "GAUGE"

top10_cheeps:
  query: |
    SELECT
        u."UserName",
        u."Id",
        COUNT(c."CheepId") AS value
    FROM "AspNetUsers" u
    LEFT JOIN "Cheeps" c ON c."AuthorId" = u."Id"
    GROUP BY u."Id", u."UserName"
    ORDER BY value DESC
    LIMIT 10
  metrics:
    - UserName:
        usage: "LABEL"
    - Id:
        usage: "LABEL"
    - value:
        usage: "GAUGE"