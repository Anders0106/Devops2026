server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
      - source_labels: ['__meta_docker_container_id']
        regex: '(.+)'
        replacement: /var/lib/docker/containers/$1/$1-json.log
        target_label: __path__
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        regex: '(.+)'
        target_label: service
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name', '__meta_docker_container_name']
        separator: ';'
        regex: '([^;]+);.*|;/(.*)'
        target_label: job
        replacement: '$1$2'
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - labels:
          stream:
      - output:
          source: output
