name: CI
on: [push, pull_request]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep security scan
        run: semgrep scan --config=p/csharp --config=p/owasp-top-ten --error src/

  test:
    needs: [semgrep]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chirp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Load seed data
        run: psql -h localhost -U postgres -d chirp -f scripts/seed.sql
        env:
          PGPASSWORD: postgres
      - name: Build
        run: dotnet build
      - name: Install Playwright browsers
        run: npx playwright@1.49.0 install --with-deps chromium
      - name: Run tests
        run: make test
        env:
          ASPNETCORE_URLS: http://localhost:5273
